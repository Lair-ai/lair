name: CI

on:
  push:
    branches:
      - main
  pull_request:

jobs:
  lint-and-test:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Install dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y shellcheck bats

      - name: Run shellcheck
        run: ./ci/lint/shellcheck.sh

      - name: Run bats tests
        run: ./ci/test/run-bats.sh

  helm-lint:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout
        uses: actions/checkout@v6

      - name: Setup Helm
        uses: azure/setup-helm@v5

      - name: Helm lint
        run: helm lint ./helm-chart

      - name: Helm template validation
        run: helm template lair ./helm-chart -f ./helm-chart/values.yaml >/dev/null
