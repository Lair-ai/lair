# Lair Configuration for Standard
# Usage: sudo ./setup.sh --config lair-config-standard.yaml

# Basic Configuration
client_name: "CHANGE_ME_CLIENT_NAME"
config_name: "CHANGE_ME_CONFIG_NAME"

# System Detection
detection_choice: 1 # Use local system detection
use_detected_resources: true # Use auto-detected resources

# Manual Resource Override (not used since use_detected_resources: true)
manual_resources:
  cpu_cores: 8.0
  memory_gb: 32
  storage_gb: 1420

# Platform Configuration
platform:
  is_jetson: false # Standard platform
  is_dgx_spark: false # NVIDIA DGX Spark uses the dedicated ARM64 template
  has_gpu: false # CPU-only configuration
  vram_percentage: 80
  system_hostname: "CHANGE_ME_HOSTNAME" # Hostname for LAN domains (subdomain.lair.local)

# Dual Access Configuration
access:
  lan:
    enabled: false # Disable LAN access for this standard configuration
    tls: false # Not used when LAN access is disabled
  public:
    enabled: true # Enable public access with real domains

# Email and Domains
email:
  cert_email: "CHANGE_ME_CERT_EMAIL"

# Domain configuration
domains:
  # Legacy domains (for backward compatibility)
  openwebui: "CHANGE_ME_OPENWEBUI_PUBLIC_DOMAIN"
  n8n: "CHANGE_ME_N8N_PUBLIC_DOMAIN"
  comfyui: "" # Internal-only access: lair-comfyui.lair.svc.cluster.local:80
  minio: "CHANGE_ME_MINIO_PUBLIC_DOMAIN" # External access enabled
  ollama: "" # Strictly internal-only access for security reasons

  # Public domains (for dual access mode)
  public:
    openwebui: "CHANGE_ME_OPENWEBUI_PUBLIC_DOMAIN"
    n8n: "CHANGE_ME_N8N_PUBLIC_DOMAIN"
    comfyui: "" # Internal-only access
    minio: "CHANGE_ME_MINIO_PUBLIC_DOMAIN"
    ollama: "" # Strictly internal-only access for security reasons

  # LAN domains (not used when access.lan.enabled: false)
  lan:
    openwebui: ""
    n8n: ""
    comfyui: ""
    minio: ""
    ollama: ""

# Component Storage Configuration (in GB)
storage:
  openwebui: 10
  ollama_models: 30
  n8n_workflows: 10
  postgresql: 5
  redis: 5
  minio: 20
  comfyui: 15

# OpenWebUI SSO Configuration (disabled by default)
openwebui:
  sso:
    enabled: false
    provider: "" # Options: google, microsoft, github, oidc, trusted-header

# Component Enablement
components:

  minio:
    enabled: true
    root_user: "CHANGE_ME_MINIO_ROOT_USER" # Root/admin username (change for production!)
    root_password: "CHANGE_ME_MINIO_ROOT_PASSWORD" # Root/admin password (change for production!)
    access_key: "CHANGE_ME_MINIO_ACCESS_KEY"
    secret_key: "CHANGE_ME_MINIO_SECRET_KEY"

  comfyui:
    enabled: true
    gpuEnabled: false # CPU-only for standard config
    image: "" # Default image

  ollama:
    image: "" # Default image

# N8N Configuration
n8n:
  encryption_key: "CHANGE_ME_N8N_ENCRYPTION_KEY" # Use existing key
  # Worker configuration for production setup
  worker:
    enabled: true
    replicas: 2 # Multiple workers for production
    resources:
      limits:
        memory: "2Gi" # Full memory allocation
        cpu: "1000m" # Full core allocation
      requests:
        memory: "1Gi" # Production memory request
        cpu: "500m" # Half core request
  # SMTP configuration for user management
  smtp:
    enabled: false # Disabled by default - set to true and configure below to enable
    host: "CHANGE_ME_SMTP_HOST"
    port: 587
    user: "CHANGE_ME_SMTP_USER"
    password: "CHANGE_ME_SMTP_PASSWORD"
    sender: "CHANGE_ME_SMTP_SENDER"
    ssl: true
    starttls: true

  # Admin user configuration (required for N8N access)
  adminUser:
    email: "CHANGE_ME_N8N_ADMIN_EMAIL" # Admin email - used for login and notifications
    password: "CHANGE_ME_N8N_ADMIN_PASSWORD" # Admin password - CHANGE FOR PRODUCTION!
    firstName: "CHANGE_ME_FIRST_NAME" # Admin first name
    lastName: "CHANGE_ME_LAST_NAME" # Admin last name
    # SECURITY WARNING: Change these credentials for production deployments!

    # Auto-deployment
deployment:
  auto_deploy: false
  release_name: "lair"
  new_install: true
