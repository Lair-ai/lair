{{- if .Values.minio.enabled }}
apiVersion: apps/v1
kind: Deployment
metadata:
  name: minio
  namespace: {{ .Values.namespace }}
spec:
  revisionHistoryLimit: 2
  replicas: {{ .Values.replicaCount }}
  selector:
    matchLabels:
      app: minio
  template:
    metadata:
      labels:
        app: minio
    spec:
      containers:
        - name: minio
          image: "{{ .Values.minio.image.repository }}:{{ .Values.minio.image.tag }}"
          args:
            - server
            - /data
            - --console-address
            - ":9001"
          ports:
            - containerPort: {{ .Values.minio.port }}
              name: api
            - containerPort: 9001
              name: console
          env:
            # MinIO root user credentials for administrative access
            - name: MINIO_ROOT_USER
              value: "{{ .Values.minio.rootUser }}"
            - name: MINIO_ROOT_PASSWORD
              value: "{{ .Values.minio.rootPassword }}"
          volumeMounts:
            - name: data
              mountPath: /data
          resources:
            limits:
              memory: "{{ .Values.minio.resources.limits.memory }}"
              cpu: "{{ .Values.minio.resources.limits.cpu }}"
            requests:
              memory: "{{ .Values.minio.resources.requests.memory }}"
              cpu: "{{ .Values.minio.resources.requests.cpu }}"
      volumes:
        - name: data
          persistentVolumeClaim:
            claimName: minio-pvc
---
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: minio-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ include "lair.storageClassName" . }}
  resources:
    requests:
      storage: {{ .Values.minio.storage.size }}
{{- end }}