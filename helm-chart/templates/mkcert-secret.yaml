{{- if and .Values.ingress.lan.enabled .Values.ingress.lan.enableTLS }}
---
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.ingress.lan.tlsSecretName | default "lair-tls-local" }}
  namespace: {{ .Values.namespace }}
  annotations:
    # This secret contains TLS certificates for .local domains
    # Generate certificates using mkcert before deploying:
    # 1. Install mkcert: https://github.com/FiloSottile/mkcert
    # 2. Run: mkcert -install
    # 3. Generate certificates: mkcert {{ range $index, $host := .Values.ingress.lan.hosts }}{{ if $index }} {{ end }}{{ $host.host }}{{ end }}
    # 4. Create secret: kubectl create secret tls {{ .Values.ingress.lan.tlsSecretName | default "lair-tls-local" }} --cert=_wildcard.lair.local.pem --key=_wildcard.lair.local-key.pem -n {{ .Values.namespace }}
    helm.sh/resource-policy: keep
type: kubernetes.io/tls
data:
  # The certificate and key will be populated when you create the secret manually
  # This template serves as a placeholder and documentation
  tls.crt: {{ .Values.ingress.lan.tlsCert | default "" | b64enc }}
  tls.key: {{ .Values.ingress.lan.tlsKey | default "" | b64enc }}
{{- end }} 