      containers:
        - name: n8n
          image: "{{ .Values.n8n.image.repository }}:{{ .Values.n8n.image.tag }}"
          ports:
            - containerPort: 5678
            - containerPort: 5679 # Health check port per la queue
          envFrom:
            - configMapRef:
                name: services-config
          env:
            - name: N8N_PORT
              value: "5678"

            {{- $n8nPublicHost := "" }}
            {{- $n8nPublicUrl := "" }}
            {{- range .Values.ingress.hosts }}
              {{- if eq .serviceName "n8n" }}
                {{- $n8nPublicHost = .host }}
                {{- $n8nPublicUrl = printf "https://%s" .host }}
              {{- end }}
            {{- end }}

            {{- if $n8nPublicUrl }}
            - name: WEBHOOK_URL
              value: {{ $n8nPublicUrl | quote }}
            - name: N8N_PROTOCOL
              value: "https"
            - name: N8N_HOST
              value: {{ $n8nPublicHost | quote }}
            {{- else }}
            - name: N8N_PROTOCOL
              value: "http"
            # If no public URL, N8N_HOST will be sourced from services-config (internal name),
            # and WEBHOOK_URL will not be set, leading to n8n using PROTOCOL/HOST/PORT.
            {{- end }}

            - name: NODE_ENV
              value: "production"
            - name: N8N_METRICS
              value: "true"
            - name: DB_TYPE
              value: "{{ .Values.n8n.database.type }}"
            - name: N8N_HOST_WHITELIST
              value: {{ include "n8n.hostWhitelist" . | quote }}
            {{- if eq .Values.n8n.database.type "postgresdb" }}
            - name: DB_POSTGRESDB_HOST
              valueFrom:
                configMapKeyRef:
                  name: services-config
                  key: N8N_POSTGRES_HOST
            - name: DB_POSTGRESDB_PORT
              valueFrom:
                configMapKeyRef:
                  name: services-config
                  key: N8N_POSTGRES_PORT
            - name: DB_POSTGRESDB_DATABASE
              valueFrom:
                configMapKeyRef:
                  name: services-config
                  key: N8N_POSTGRES_DB
            - name: DB_POSTGRESDB_USER
              valueFrom:
                configMapKeyRef:
                  name: services-config
                  key: N8N_POSTGRES_USER
            - name: DB_POSTGRESDB_PASSWORD
              valueFrom:
                secretKeyRef:
                  name: n8n-postgres-secret
                  key: postgres-password
            {{- end }}
            - name: N8N_ENCRYPTION_KEY
              valueFrom:
                secretKeyRef:
                  name: n8n-encryption-secret
                  key: encryptionKey
            # Redis for execution queue, not as database
            - name: EXECUTIONS_MODE
              value: "queue"
            - name: QUEUE_BULL_REDIS_HOST
              valueFrom:
                configMapKeyRef:
                  name: services-config
                  key: REDIS_HOST
            # Configurazioni aggiuntive per la queue
            - name: QUEUE_HEALTH_CHECK_ACTIVE
              value: "true"
            - name: QUEUE_HEALTH_CHECK_PORT
              value: "5679"
            # Timeout per le esecuzioni webhook
            - name: EXECUTIONS_TIMEOUT
              value: "3600"
            - name: EXECUTIONS_TIMEOUT_MAX
              value: "7200"
            {{- if .Values.minio.enabled }}
            - name: N8N_FILESYSTEM_ALIAS_S3_ENDPOINT
              valueFrom:
                configMapKeyRef:
                  name: services-config
                  key: MINIO_ENDPOINT
            - name: N8N_FILESYSTEM_ALIAS_S3_ACCESS_KEY_ID
              valueFrom:
                configMapKeyRef:
                  name: services-config
                  key: MINIO_ACCESS_KEY
            - name: N8N_FILESYSTEM_ALIAS_S3_SECRET_ACCESS_KEY
              valueFrom:
                secretKeyRef:
                  name: minio-secret
                  key: MINIO_SECRET_KEY
            {{- end }}
            {{- if .Values.n8n.extraEnv }}
            {{- range .Values.n8n.extraEnv }}
            - name: {{ .name }}
              value: {{ .value | quote }}
            {{- end }}
            {{- end }}
            # User management configuration
            - name: N8N_USER_MANAGEMENT_DISABLED
              value: "false"
            # Addition to manage configuration file permissions
            - name: N8N_ENFORCE_SETTINGS_FILE_PERMISSIONS
              value: "true"
            # N8N_SECURE_COOKIE should be provided via values (n8n.extraEnv) to avoid duplicate definitions
          resources:
            limits:
              memory: "{{ .Values.n8n.resources.limits.memory | default "1Gi" }}"
              cpu: "{{ .Values.n8n.resources.limits.cpu | default "1000m" }}"
            requests:
              memory: "{{ .Values.n8n.resources.requests.memory | default "512Mi" }}"
              cpu: "{{ .Values.n8n.resources.requests.cpu | default "300m" }}"
          {{- if .Values.n8n.persistence.enabled }}
          volumeMounts:
            - name: n8n-data
              mountPath: /home/node/.n8n
          {{- end }}
      {{- if .Values.n8n.persistence.enabled }}
      volumes:
        - name: n8n-data
          persistentVolumeClaim:
            claimName: n8n-pvc
      {{- end }}
---
{{- if .Values.n8n.persistence.enabled }}
apiVersion: v1
kind: PersistentVolumeClaim
metadata:
  name: n8n-pvc
  namespace: {{ .Values.namespace }}
spec:
  accessModes:
    - ReadWriteOnce
  storageClassName: {{ include "lair.storageClassName" . }}
  resources:
    requests:
      storage: {{ .Values.n8n.persistence.size }}
{{- end }}