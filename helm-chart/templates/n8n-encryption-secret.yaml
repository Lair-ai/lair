apiVersion: v1
kind: Secret
metadata:
  name: n8n-encryption-secret
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
    helm.sh/resource-policy: keep
type: Opaque
{{- $existingSecret := lookup "v1" "Secret" .Values.namespace "n8n-encryption-secret" }}
{{- $encryptionKey := "" }}
{{- if .Values.n8n.encryptionKey }}
  {{- $encryptionKey = .Values.n8n.encryptionKey | b64enc }}
{{- else if and $existingSecret $existingSecret.data (index $existingSecret.data "encryptionKey") }}
  {{- $encryptionKey = index $existingSecret.data "encryptionKey" }}
{{- else }}
  {{- $encryptionKey = randAlphaNum 32 | b64enc }}
{{- end }}
data:
  encryptionKey: {{ $encryptionKey | quote }}
