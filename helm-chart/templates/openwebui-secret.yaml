apiVersion: v1
kind: Secret
{{- $secretName := .Values.openWebUI.auth.secretName }}
{{- $existingSecret := lookup "v1" "Secret" .Values.namespace $secretName }}
{{- $secretKey := "" }}
{{- if .Values.openWebUI.auth.secretKey }}
  {{- $secretKey = .Values.openWebUI.auth.secretKey | b64enc }}
{{- else if and $existingSecret $existingSecret.data (index $existingSecret.data "WEBUI_SECRET_KEY") }}
  {{- $secretKey = index $existingSecret.data "WEBUI_SECRET_KEY" }}
{{- else }}
  {{- $secretKey = randAlphaNum 32 | b64enc }}
{{- end }}
metadata:
  name: {{ $secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
    helm.sh/resource-policy: keep
type: Opaque
data:
  WEBUI_SECRET_KEY: {{ $secretKey | quote }}