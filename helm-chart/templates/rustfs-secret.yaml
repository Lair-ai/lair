{{- if .Values.rustfs.enabled }}
apiVersion: v1
kind: Secret
{{- $secretName := "rustfs-secret" }}
{{- $existingSecret := lookup "v1" "Secret" .Values.namespace $secretName }}
{{- $secretKey := "" }}
{{- if .Values.rustfs.rootPassword }}
  {{- $secretKey = .Values.rustfs.rootPassword | b64enc }}
{{- else if and $existingSecret $existingSecret.data (index $existingSecret.data "RUSTFS_SECRET_KEY") }}
  {{- $secretKey = index $existingSecret.data "RUSTFS_SECRET_KEY" }}
{{- else }}
  {{- $secretKey = randAlphaNum 32 | b64enc }}
{{- end }}
metadata:
  name: {{ $secretName }}
  namespace: {{ .Values.namespace }}
  labels:
    app.kubernetes.io/managed-by: {{ .Release.Service | quote }}
  annotations:
    meta.helm.sh/release-name: {{ .Release.Name | quote }}
    meta.helm.sh/release-namespace: {{ .Release.Namespace | quote }}
    helm.sh/resource-policy: keep
type: Opaque
data:
  RUSTFS_ACCESS_KEY: {{ .Values.rustfs.rootUser | b64enc | quote }}
  RUSTFS_SECRET_KEY: {{ $secretKey | quote }}
{{- end }}
