# Lair Helm Chart - Default Values
#
# This file contains safe defaults for all components.
# Configuration files generated by create-config.sh (values-*.yaml) will override these defaults.
#
# Usage:
#   helm install lair . -f values.yaml -f values-myconfig.yaml
#   
# The second file (values-myconfig.yaml) takes precedence over this file.
#
# IMPORTANT: GPU settings default to FALSE for safety. Use create-config.sh to generate 
namespace: lair
replicaCount: 1
createStorageClass: true
createNamespace: true

longhorn:
  kubeletRootDir: "/var/snap/microk8s/common/var/lib/kubelet"
  numberOfReplicas: 1 # Number of replicas for data redundancy (automatically calculated based on cluster nodes)

certManager:
  email: your-email@example.com
  createClusterIssuer: true
  clusterIssuer: lair-letsencrypt

ingress:
  className: public
  annotations:
    kubernetes.io/ingress.class: public
    cert-manager.io/cluster-issuer: lair-letsencrypt

  # LAN Access Configuration (.local domains)
  lan:
    enabled: false
    enableTLS: false # Set to true to enable HTTPS for .local domains
    tlsSecretName: lair-tls-local # Name of the TLS secret containing mkcert certificates
    hosts:
    - host: openwebui.lair.local
      serviceName: lair-openwebui
      servicePort: 80
      paths:
      - path: /
        pathType: Prefix
    - host: n8n.lair.local
      serviceName: lair-n8n
      servicePort: 80
      paths:
      - path: /
        pathType: Prefix
    - host: images.lair.local
      serviceName: lair-comfyui
      servicePort: 80
      paths:
      - path: /
        pathType: Prefix

  # Public Access Configuration (internet domains)
  public:
    enabled: true
    hosts:
    - host: lair.example.com
      serviceName: lair-openwebui
      servicePort: 80
      paths:
      - path: /
        pathType: Prefix
    - host: n8n.example.com
      serviceName: lair-n8n
      servicePort: 80
      paths:
      - path: /
        pathType: Prefix
    - host: comfyui.example.com
      serviceName: lair-comfyui
      servicePort: 80
      paths:
      - path: /
        pathType: Prefix

openWebUI:
  image:
    repository: ghcr.io/open-webui/open-webui
    tag: "0.9.6"
  plugins: []
  auth:
    enabled: true
    secretName: openwebui-auth
    secretKey: "" # If left empty, a random 32-character key will be automatically generated during installation
    enableSignup: true # Allow new user registration
    defaultUserRole: "pending" # Default role for new users
    userPermissions:
      chatDeletion: true # Allow users to delete their chats
  persistence:
    enabled: true
    size: 10Gi
    enablePersistentConfig: true
  # S3 Storage Configuration (when MinIO is enabled)
  # When minio.enabled is true, OpenWebUI will use MinIO for file storage
  s3:
    enabled: false # Automatically set to true when MinIO is enabled
    bucketName: "openwebui-storage" # S3 bucket for OpenWebUI files
    region: "us-east-1" # MinIO default region
    addressingStyle: "path" # path-style for MinIO compatibility
    useAccelerateEndpoint: false # Disabled for MinIO
    enableTagging: false # Disabled for MinIO
    keyPrefix: "" # Optional prefix for all S3 keys
  # SSO Configuration - disabled by default
  sso:
    enabled: false
    provider: "" # Options: google, microsoft, github, oidc, trusted-header
    # Local login form settings (when SSO is enabled, these are automatically set to false)
    enableLoginForm: false # Set to false to hide email/password login when SSO is enabled
    enableLocalSignup: false # Set to false to disable local account creation when SSO is enabled
    oauth:
      enableSignup: true
      mergeAccountsByEmail: false
      updatePictureOnLogin: true
      clientId: ""
      clientSecret: ""
      providerName: "SSO"
      scopes: "openid email profile"
      providerUrl: ""
      redirectUri: ""
    google:
      clientId: ""
      clientSecret: ""
      redirectUri: ""
    microsoft:
      clientId: ""
      clientSecret: ""
      tenantId: ""
      redirectUri: ""
    github:
      clientId: ""
      clientSecret: ""
    trustedHeader:
      emailHeader: ""
      nameHeader: ""
  # RAG Configuration with Tika
  rag:
    contentExtractionEngine: "tika" # Uses Apache Tika for document processing
    enableHybridSearch: true # Combines dense and sparse search methods
    textSplitter: "token" # Token-based text splitting
    chunkSize: 1000 # Size of document chunks in tokens
    chunkOverlap: 200 # Overlap between chunks in tokens
    topK: 5 # Number of top results to retrieve
    pdfExtractImages: true # Extract text from images in PDFs using OCR
  # Audio Configuration
  audio:
    whisperModel: "turbo" # Whisper model for speech-to-text
    vadFilter: true # Voice activity detection filter
    autoUpdate: false # Auto-update Whisper models
    sttEngine: "whisper" # Speech-to-text engine
    ttsEngine: "openai" # Text-to-speech engine
  # Feature Configuration
  features:
    enableCommunitySharing: true # Allow sharing with community
    enableMessageRating: true # Allow rating of messages
  # System Configuration
  baseUrl: "" # Base URL for the application (auto-detected if empty)
  admin:
    email: "" # Admin email for system notifications
  # Model Configuration
  models:
    filterList: "" # Comma-separated list of allowed models (empty = all models)
  resources:
    limits:
      memory: 1Gi
      cpu: 1000m
    requests:
      memory: 512Mi
      cpu: 300m
  probes:
    liveness:
      enabled: true
      initialDelaySeconds: 300
      periodSeconds: 30
    readiness:
      enabled: true
      initialDelaySeconds: 180
      periodSeconds: 20
  port: 8080 # Default port for Open WebUI

ollama:
  gpuEnabled: false # Default: CPU-only mode. Configuration files generated by create-config.sh will override this based on GPU detection
  image:
    repository: ollama/ollama
    tag: latest
  imagePullPolicy: Always
  memoryRequest: 4096 # MB - RAM memory request for Kubernetes scheduling (not VRAM)
  memoryLimit: 8192 # MB - RAM memory limit for Kubernetes scheduling (not VRAM)
  performances:
    numParallel: 2
    maxQueue: 256
    keepAlive: 300
    maxLoadedModels: 1
    kvCacheType: "q8_0"
    flashAttention: 1
  persistence:
    size: 20Gi
  probes:
    readiness:
      initialDelaySeconds: 300
      periodSeconds: 60
      timeoutSeconds: 30
      failureThreshold: 5
    liveness:
      initialDelaySeconds: 600
      periodSeconds: 120
      timeoutSeconds: 60
      failureThreshold: 3
  resources:
    limits:
      memory: 4Gi
      cpu: 2000m
    requests:
      memory: 2Gi
      cpu: 1000m

comfyUI:
  enabled: false # Default: disabled for safety. Configuration files generated by create-config.sh will enable this based on memory availability
  gpuEnabled: false # Default: CPU-only mode. Configuration files generated by create-config.sh will override this based on GPU detection
  image:
    repository: mmartial/comfyui-nvidia-docker
    tag: ubuntu24_cuda12.6.3-latest
  plugins: []
  # Special configuration for optimized images
  lowVram: "" # Reserved for future use
  modelsDownload: "" # Reserved for future use
  persistence:
    enabled: true
    size: 10Gi
  resources:
    limits:
      memory: 24Gi
      cpu: 4000m
    requests:
      memory: 8Gi
      cpu: 2000m

n8n:
  image:
    repository: n8nio/n8n
    tag: latest
  templatesConfigMap: n8n-templates
  encryptionKey: "" # Se vuoto, viene generato automaticamente
  persistence:
    enabled: true
    size: 10Gi
  database:
    type: postgresdb
  # Admin user configuration
  adminUser:
    email: "admin@n8n.local"
    password: "n8n123"
    firstName: "Admin"
    lastName: "User"
  # Worker configuration to process the queue
  worker:
    enabled: true
    replicas: 2 # Number of workers to process the queue
    resources:
      limits:
        memory: 2Gi
        cpu: 1000m
      requests:
        memory: 1Gi
        cpu: 500m
  postgres:
    image:
      # repository: postgres
      # tag: 15-alpine
      repository: ankane/pgvector
      tag: v0.5.1
    # Password is stored in Kubernetes Secret n8n-postgres-secret.
    user: n8n
    database: n8n
    persistence:
      size: 5Gi
    resources:
      limits:
        memory: 1Gi
        cpu: 1000m
      requests:
        memory: 512Mi
        cpu: 100m
  extraEnv:
  - name: N8N_USER_FOLDER
    value: "/home/node/.n8n"
  - name: UID
    value: "1000"
  - name: N8N_LOG_LEVEL
    value: "info"
  resources:
    limits:
      memory: 1Gi
      cpu: 1000m
    requests:
      memory: 512Mi
      cpu: 300m

tika:
  image:
    repository: apache/tika
    # tag: latest
    tag: latest-full # Include OCR support with Tesseract
  resources:
    limits:
      memory: 1536Mi
      cpu: 1500m
    requests:
      memory: 256Mi
      cpu: 100m
redis:
  image:
    repository: redis
    tag: 7.4.3
  persistence:
    enabled: true
    size: 5Gi
  resources:
    limits:
      memory: 512Mi
      cpu: 500m
    requests:
      memory: 256Mi
      cpu: 200m

minio:
  enabled: true
  image:
    repository: minio/minio
    tag: latest
  # Root user credentials provide both administrative AND S3 API access
  # These are used for all MinIO operations (console, API, bucket management)
  rootUser: minioadmin
  rootPassword: minioadmin
  storage:
    size: 10Gi
  port: 9000 # API port
  consolePort: 9001 # Web console port  
  resources:
    limits:
      memory: "1Gi"
      cpu: "500m"
    requests:
      memory: "512Mi"
      cpu: "250m"

velero:
  enabled: false
  namespace: velero
  # NOTE: Velero installation (BSL, credentials) is handled by cluster setup scripts
  # This section only configures the backup Schedule for the 'lair' namespace
  # Cluster identifier for backup naming (useful when multiple clusters share the same S3 bucket)
  # If empty, uses "lair" as default. Examples: "zeus", "demo", "prod-eu"
  clusterName: ""
  backup:
    schedule: "0 2 * * *"
    ttl: "720h0m0s" # 30 days
    includeNamespaces:
      - lair
    excludeNamespaces: []
    # Volume backup configuration
    snapshotVolumes: true # Enable volume snapshots
    defaultVolumesToFsBackup: true # Use file-system backup (Restic/Kopia) for PVCs

global:
  storageClass: lair-storage # Base name - will become lair-storage-longhorn (standard) or lair-hostpath (jetson)
  platform: "standard" # Options: "standard" (x86/x64 with Longhorn), "jetson" (ARM with hostpath)
